# my_app 官网站点（原样保留原有配置）+ TRAE Pro 官网（/traepro/ 路径挂载）+ QQMusicWear 官网（/qqmusicwear/ 路径挂载）
# 安装到 /www/server/panel/vhost/nginx/suspect-site.conf
# 说明：各子站点均以路径前缀挂载，不影响原有站点
# 安装：/www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload

server {
    listen 80 default_server;
    listen 8080 default_server;
    server_name _;
    index index.html;
    root /www/wwwroot/suspect-site;
    autoindex off;

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ==================== TRAE Pro 官网（新增）====================
    location = /traepro { return 301 /traepro/; }

    location /traepro/ {
        try_files $uri $uri/ /traepro/index.html;
    }

    # 账号中心 auth-center :3010（/traepro/auth/v1/login → /v1/login）
    location /traepro/auth/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 代签服务 trae-worker :3011（/traepro/trae/v1/accounts → /v1/accounts）
    location /traepro/trae/ {
        proxy_pass http://127.0.0.1:3011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # ================== TRAE Pro 官网（新增结束）==================

    # ==================== QQMusicWear 官网（新增）====================
    location = /qqmusicwear { return 301 /qqmusicwear/; }

    location /qqmusicwear/ {
        try_files $uri $uri/ /qqmusicwear/index.html;
    }

    # App 更新通道：version.json 不缓存（发布即生效），APK 直链带正确 MIME
    location /qqmusicwear/update/ {
        location ~* version\.json$ {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }
        location ~* \.apk$ {
            types { application/vnd.android.package-archive apk; }
            try_files $uri =404;
        }
    }
    # ================== QQMusicWear 官网（新增结束）==================

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/suspect-site.log;
}
