# QQMusicWear 官网独立站点：https://musicwear.suspect.top
#
# 安装位置：/www/server/panel/vhost/nginx/musicwear.conf
#   （宝塔 nginx.conf 会 include 该目录下全部 *.conf，一个项目一个文件，
#     不去改动共享的 suspect-site.conf / subdomains.conf，避免牵连其他站点）
# 生效前请执行：/www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
#
# DNS：suspect.top 已在 DNSPod 存在 musicwear 的 A 记录指向 111.229.33.249，无需新增解析。
# 证书：Let's Encrypt 泛域名 *.suspect.top + suspect.top（有效期至 2027-01-12），
#       新增同级子域名无需重新签发，直接复用这一对 fullchain/privkey。
# 静态文件：/www/wwwroot/suspect-site/qqmusicwear/{index.html,shots/,ga_beian.png,update/}

# ---- HTTP 80：一律 301 到 HTTPS ----
server {
    listen 80;
    server_name musicwear.suspect.top;

    return 301 https://$host$request_uri;

    access_log /www/wwwlogs/musicwear-sub.log;
}

# ---- HTTPS 443：纯静态官网 + 应用内更新清单/APK 分发 ----
server {
    listen 443 ssl;
    http2 on;
    server_name musicwear.suspect.top;

    ssl_certificate     /etc/nginx/ssl/suspect.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/suspect.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    index index.html;
    root /www/wwwroot/suspect-site/qqmusicwear;
    autoindex off;

    # 截图与图标可缓存；HTML 与更新清单不缓存，发版即时生效
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /update/version.json {
        add_header Cache-Control "no-cache";
        default_type application/json;
    }

    location / { try_files $uri $uri/ =404; }

    access_log /www/wwwlogs/musicwear-sub-ssl.log;
}
