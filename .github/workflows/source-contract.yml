name: source-contract

# 音乐源脚本推送门禁：签名校验 + 契约测试，防止坏推送/未签名推送到所有用户
on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'tools/**'
      - '.github/workflows/source-contract.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'tools/**'
      - '.github/workflows/source-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify source signature & contract (all sources)
        run: |
          set -e
          shopt -s nullglob
          files=(source/*_source.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "source/ 不在仓库中（音乐源脚本仅通过 CDN 分发），跳过契约测试"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "===== $f ====="
            node tools/contract-test/verify_sig.js "$f" tools/source-signing/source_signing_public.key
            node tools/contract-test/run.js "$f"
            node tools/contract-test/mock_smoke.js "$f"
          done
